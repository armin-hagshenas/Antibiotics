<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جنگ باکتری‌ها؛ مقاومت میکروبی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6f6f2;--bg2:#fdf1dc;--surf:#fff;--ink:#0f2f2b;--mute:#4f6f69;--line:#bfe0d8;--teal:#0b8a7a;--mag:#d81b60;--amb:#f2a516;--vir:#6f4cf0;--grn:#22a55b;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1d2a;--bg2:#1b1233;--surf:#132f3d;--ink:#e6f5f1;--mute:#9cc2bb;--line:#25505e;--teal:#3fd0bd;--mag:#ff6fa3;--amb:#ffc247;--vir:#a28bff;--grn:#4fd98a;--on:#06201c}}
:root[data-theme="dark"]{--bg:#0a1d2a;--bg2:#1b1233;--surf:#132f3d;--ink:#e6f5f1;--mute:#9cc2bb;--line:#25505e;--teal:#3fd0bd;--mag:#ff6fa3;--amb:#ffc247;--vir:#a28bff;--grn:#4fd98a;--on:#06201c}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),var(--bg2));background-attachment:fixed;color:var(--ink);font:400 17px/1.8 Vazirmatn,Tahoma,sans-serif;min-height:100vh}
main{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:14px}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.fl{position:absolute;opacity:.2;animation:fl var(--t) ease-in-out infinite alternate}
@keyframes fl{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--x),var(--y)) rotate(var(--rr))}}
.hero{text-align:center;padding:10px 0 4px}
h1{font-size:1.75rem;line-height:1.4;margin:0;font-weight:800;background:linear-gradient(90deg,var(--teal),var(--vir),var(--mag));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.15rem;margin:0 0 6px;font-weight:800}
.sub{color:var(--mute);margin:2px 0 12px}
nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
nav button{flex:none;border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:3px 14px;font:700 .95rem Vazirmatn,Tahoma,sans-serif;cursor:pointer}
nav button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:var(--on)}
.card{background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(6px);border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
button:focus-visible,a:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.btn{display:block;width:100%;font:800 1.05rem/1.7 Vazirmatn,Tahoma,sans-serif;color:var(--on);background:var(--teal);border:0;border-radius:16px;padding:10px 14px;margin-top:8px;cursor:pointer;transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.o{background:var(--amb);color:#2b1c00}.btn.g{background:none;color:var(--ink);border:2px solid var(--line)}.btn.m{background:var(--mag);color:#fff}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.field{min-height:150px;border-radius:50%/40%;background:radial-gradient(ellipse,color-mix(in srgb,var(--teal) 14%,transparent),transparent 70%);display:flex;flex-wrap:wrap;gap:2px;align-content:center;justify-content:center;padding:14px;margin:6px 0}
.cr{width:34px;height:34px;animation:wob 2.2s ease-in-out infinite;animation-delay:var(--d);transform:rotate(var(--r))}
@keyframes wob{50%{transform:rotate(calc(var(--r) + 14deg)) scale(1.08)}}
.s{color:var(--teal)}.m{color:var(--amb)}.r{color:var(--mag)}.v{color:var(--vir)}.f{color:var(--grn)}.b{color:#b0482e}
.lg{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:.85rem;color:var(--mute)}
.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:5px;vertical-align:middle}
.pt{display:flex;align-items:center;gap:12px}
.face{font-size:3rem;line-height:1;transition:transform .3s}
.bars{flex:1}
.bl{font-size:.85rem;color:var(--mute);display:flex;justify-content:space-between}
.bar{height:11px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;transition:width .6s}
.meter{position:relative;height:22px;border-radius:12px;overflow:hidden;display:flex;margin-top:4px}
.meter i{display:block;height:100%}
.mk{position:absolute;top:-2px;width:6px;height:26px;background:var(--ink);border-radius:4px;transition:inset-inline-start .5s}
.tl{display:flex;gap:5px;justify-content:center;margin:10px 0}
.tl span{width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:.9rem}
.tl .on{border:2px solid var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 30%,transparent)}
.tip{border-right:5px solid var(--amb);padding:4px 12px;margin:8px 0;background:color-mix(in srgb,var(--amb) 12%,transparent);border-radius:10px}
.tip small{display:block;color:var(--mute)}
.note{color:var(--mute);font-size:.86rem}
.nodes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.nd{border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:18px;padding:10px;font:700 1rem Vazirmatn,Tahoma,sans-serif;cursor:pointer;text-align:center}
.nd span{display:block;font-size:2rem}
.nd[aria-pressed=true]{border-color:var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 30%,transparent)}
.num{display:flex;gap:8px;text-align:center;margin-bottom:8px}
.num div{flex:1;background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:8px 2px;font-size:.8rem;line-height:1.5}
.num b{display:block;font-size:1.6rem;color:var(--mag)}
.hb{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:.85rem}
.mt{perspective:700px;margin-bottom:10px}
.mt button{display:block;width:100%;border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:right}
.mt .in{position:relative;transition:transform .5s;transform-style:preserve-3d;min-height:116px}
.mt .in.fp{transform:rotateY(180deg)}
.mt .fa,.mt .ba{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;padding:12px 14px;border:2px solid var(--line)}
.mt .fa{background:var(--surf)}
.mt .ba{background:var(--teal);color:var(--on);transform:rotateY(180deg);border-color:var(--teal);font-size:.95rem;line-height:1.6;overflow:auto}
.mt .ba a{color:inherit;font-size:.8rem}
.ck{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line);cursor:pointer}
.ck input{width:22px;height:22px;accent-color:var(--teal)}
ul.src{padding-right:20px;margin:0}ul.src li{margin-bottom:8px}ul.src a{color:var(--teal);font-weight:700;word-break:break-all}
.big{font-size:2rem;font-weight:800;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="rod" viewBox="0 0 40 40"><rect x="3" y="10" width="34" height="20" rx="10" fill="currentColor"/><circle cx="15" cy="18" r="3.2" fill="#fff"/><circle cx="25" cy="18" r="3.2" fill="#fff"/><circle cx="15.8" cy="18.6" r="1.5" fill="#222"/><circle cx="25.8" cy="18.6" r="1.5" fill="#222"/><path d="M15 24q5 3.5 10 0" stroke="#222" fill="none" stroke-width="1.6" stroke-linecap="round"/></symbol>
<symbol id="rodR" viewBox="0 0 40 40"><rect x="3" y="10" width="34" height="20" rx="10" fill="currentColor"/><circle cx="15" cy="19" r="3.2" fill="#fff"/><circle cx="25" cy="19" r="3.2" fill="#fff"/><circle cx="15.8" cy="19.6" r="1.5" fill="#222"/><circle cx="25.8" cy="19.6" r="1.5" fill="#222"/><path d="M10 13l9 3.5M30 13l-9 3.5M15 26q5-3 10 0" stroke="#222" fill="none" stroke-width="2" stroke-linecap="round"/></symbol>
<symbol id="vir" viewBox="0 0 40 40"><g stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M20 3v7M20 30v7M3 20h7M30 20h7M8 8l5 5M27 27l5 5M32 8l-5 5M13 27l-5 5"/></g><circle cx="20" cy="20" r="10" fill="currentColor"/><circle cx="16.5" cy="18" r="2" fill="#fff"/><circle cx="23.5" cy="18" r="2" fill="#fff"/><path d="M16 23q4 2.5 8 0" stroke="#fff" fill="none" stroke-width="1.5"/></symbol>
<symbol id="pill" viewBox="0 0 40 40"><rect x="3" y="11" width="34" height="18" rx="9" fill="currentColor"/><path d="M20 11h8a9 9 0 010 18h-8z" fill="#fff" opacity=".85"/></symbol>
</defs></svg>
<div id="bg" aria-hidden="true"></div>
<main>
<div class="hero"><h1>جنگ باکتری‌ها</h1><p class="sub">ببین آنتی‌بیوتیک‌ها چطور کم‌اثر می‌شوند، و تو چطور می‌توانی جلویش را بگیری.</p></div>
<nav id="nav"></nav>
<div id="app"></div>
</main>
<script>
const $=s=>document.querySelector(s),app=$("#app"),fa=n=>Number(n).toLocaleString("fa-IR");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={
 fact:["WHO: Antimicrobial resistance (fact sheet)","https://www.who.int/news-room/fact-sheets/detail/antimicrobial-resistance"],
 glass:["WHO: Widespread resistance to common antibiotics (13 Oct 2025)","https://www.who.int/news/item/13-10-2025-who-warns-of-widespread-resistance-to-common-antibiotics-worldwide"],
 eu:["WHO/Europe: Antimicrobial resistance (fact sheet)","https://www.who.int/europe/news-room/fact-sheets/item/antimicrobial-resistance"],
 file:["WHO: Antimicrobial resistance fact file","https://www.who.int/features/factfiles/antimicrobial_resistance/en/"],
 work:["WHO: Antimicrobial resistance (our work)","https://www.who.int/our-work/antimicrobial-resistance"],
 paho:["PAHO: WHO warns of widespread resistance (13 Oct 2025)","https://www.paho.org/en/news/13-10-2025-who-warns-widespread-resistance-common-antibiotics-worldwide"],
 cidrap:["CIDRAP: WHO, AMR is widespread globally and increasing","https://www.cidrap.umn.edu/antimicrobial-stewardship/who-antimicrobial-resistance-widespread-globally-and-increasing"],
 rep:["WHO: Global antibiotic resistance surveillance report 2025 (summary)","https://www.who.int/publications/i/item/B09585"]
};
const lk=k=>`<a href="${S[k][1]}" target="_blank" rel="noopener">${esc(S[k][0])}</a>`;
// background floaters
(()=>{const ids=["rod","rodR","vir","pill"],cl=["s","m","r","v","f"],bg=$("#bg");
for(let i=0;i<18;i++){const d=document.createElement("div"),z=28+Math.random()*50;
d.className="fl "+cl[i%5];d.style.cssText=`left:${Math.random()*95}%;top:${Math.random()*95}%;width:${z}px;height:${z}px;--t:${9+Math.random()*10}s;--x:${(Math.random()-.5)*120}px;--y:${(Math.random()-.5)*160}px;--rr:${(Math.random()-.5)*160}deg`;
d.innerHTML=`<svg viewBox="0 0 40 40" width="100%" height="100%"><use href="#${ids[i%4]}"/></svg>`;bg.appendChild(d)}})();
const cr=(t,c,i)=>`<svg class="cr ${c}" viewBox="0 0 40 40" style="--d:${(i*.37%2).toFixed(2)}s;--r:${(i*47%50)-25}deg"><use href="#${t}"/></svg>`;
const grp=(t,c,n)=>Array.from({length:n},(_,i)=>cr(t,c,i)).join("");
const sc=(x,mx,cap)=>x>=.5?Math.max(1,Math.round(x/mx*cap)):0;

// ---------- Battle simulator ----------
function battle(){
 const MAX=8;let st;
 const slot=k=>`روز ${fa(Math.floor(k/2)+1)}، ${k%2?"شب":"صبح"}`;
 const init=()=>{st={k:0,S:800,M:30,R:0,L:0,h:[],ph:"course",busy:false,zone:"",msg:"بیمار عفونت باکتریایی دارد. آنتی‌بیوتیک هر ۱۲ ساعت باید مصرف شود، یعنی صبح و شب. کمک کن درمان درست پیش برود."};draw()};
 const eff=took=>{
  if(took)st.L=Math.min(1,st.L+.6);
  const L=st.L;
  if(L>=.5){st.zone="امن";st.S*=.2;st.M*=.3;st.R*=1.2}
  else if(L>=.25){st.zone="خطر";st.S*=.2;st.R+=.1*st.M;st.M*=1.5;st.R*=1.2}
  else{st.zone="رشد";st.S*=1.7;st.M*=1.7;st.R*=1.7}
  ["S","M","R"].forEach(x=>{if(st[x]<.05)st[x]=0});
  const t=st.S+st.M+st.R;if(t>1000){const f=1000/t;st.S*=f;st.M*=f;st.R*=f}
  st.L*=.7;st.k++;
 };
 const verdict=()=>{
  const t=st.S+st.M+st.R;st.ph="done";
  if(t<.5)st.msg="درمان کامل! دارو هر ۱۲ ساعت مصرف شد و همه‌ی باکتری‌ها از بین رفتند. تو مقاومت را متوقف کردی.";
  else if(st.R>=1)st.msg="باکتری‌های مقاوم ساخته شدند! داروی بین دوزها از غلظت مؤثر پایین آمد و باکتری‌های سخت‌جان زنده ماندند. دفعه‌ی بعد همین دارو روی آن‌ها اثر ندارد.";
  else st.msg="عفونت برگشت! باکتری‌های بازمانده دوباره تکثیر شدند. حال بیمار بهتر شده بود ولی عفونت تمام نشده بود.";
  draw();
 };
 const after=n=>{st.ph="after";st.busy=true;let i=0;const go=()=>{if(i++>=n){st.busy=false;return verdict()}eff(false);st.msg="دارو قطع شده و غلظتش در خون پایین می‌آید. باکتری‌ها فرصت می‌گیرند...";draw();setTimeout(go,650)};setTimeout(go,500)};
 const act=a=>{
  if(st.busy||st.ph!=="course")return;
  if(a==="quit"){st.h.push("q");return after(8)}
  st.h.push(a==="take"?"t":"x");eff(a==="take");
  const tl=st.S+st.M+st.R;
  st.msg=a==="take"?"دوز مصرف شد. غلظت دارو بالا رفت.":"دوز جا افتاد! غلظت دارو در خون پایین می‌آید.";
  if(st.k>=MAX){draw();return after(4)}
  if(tl<80&&a==="take")st.msg+=" بیمار احساس بهتری دارد. وسوسه نشو، هنوز باکتری هست!";
  draw();
 };
 function draw(){
  const t=st.S+st.M+st.R,p=t/1000,face=p>.5?"🤒":p>.15?"😷":"🙂",
   feel=Math.min(100,Math.round(p/.5*100)),bac=Math.min(100,Math.round(p*100)),
   lv=Math.round(st.L*100),inC=st.ph==="course";
  app.innerHTML=`<div class="card"><h2>میدان نبرد: درمان درست</h2>
  <div class="pt"><div class="face">${face}</div><div class="bars">
   <div class="bl"><span>احساس بیماری</span></div><div class="bar"><i style="width:${feel}%;background:var(--amb)"></i></div>
   <div class="bl"><span>باکتری واقعی در بدن</span></div><div class="bar"><i style="width:${Math.max(bac,t>=.5?3:0)}%;background:var(--mag)"></i></div></div></div>
  <div class="field" aria-label="باکتری‌ها">${grp("rod","s",sc(st.S,1000,40))}${grp("rod","m",sc(st.M,1000,40))}${grp("rodR","r",sc(st.R,1000,40))}</div>
  <div class="lg"><span><i style="background:var(--teal)"></i>حساس</span><span><i style="background:var(--amb)"></i>کم‌حساس</span><span><i style="background:var(--mag)"></i>مقاوم</span></div>
  <div class="bl" style="margin-top:10px"><span>غلظت دارو در خون</span><span>${st.zone?"ناحیه‌ی "+st.zone:""}</span></div>
  <div class="meter"><i style="flex:25;background:var(--mag)"></i><i style="flex:25;background:var(--amb)"></i><i style="flex:50;background:var(--teal)"></i><b class="mk" style="inset-inline-start:calc(${lv}% - 3px)"></b></div>
  <div class="bl"><span>رشد باکتری</span><span>خطر مقاومت</span><span>کشتن باکتری</span></div>
  <div class="tl">${Array.from({length:MAX},(_,i)=>`<span class="${inC&&i===st.k?"on":""}" title="${slot(i)}">${st.h[i]==="t"?"💊":st.h[i]==="x"?"✖":st.h[i]==="q"?"🛑":i+1}</span>`).join("")}</div>
  <div class="tip" aria-live="polite">${esc(st.msg)}${inC?`<small>${slot(st.k)} · نوبت ${fa(st.k+1)} از ${fa(MAX)}</small>`:""}</div>
  ${st.ph==="done"?`<button class="btn" id="rs">دوباره امتحان کن</button>`:`<div class="row"><button class="btn" id="a1" ${inC&&!st.busy?"":"disabled"}>💊 دارو را بخور</button><button class="btn o" id="a2" ${inC&&!st.busy?"":"disabled"}>⏭ جا انداختم</button></div><button class="btn g" id="a3" ${inC&&!st.busy?"":"disabled"}>🛑 حالم خوب شد، دیگر نمی‌خورم</button>`}
  <p class="note">مدل ساده‌شده برای نمایش اصل «غلظت مؤثر دارو» و «ناحیه‌ی خطر مقاومت» است. عددها واقعی نیستند. مدت و دوز واقعی درمان را همیشه پزشک تعیین می‌کند.</p></div>`;
  const g=id=>$(id);if(g("#a1"))g("#a1").onclick=()=>act("take"),g("#a2").onclick=()=>act("skip"),g("#a3").onclick=()=>act("quit");
  if(g("#rs"))g("#rs").onclick=init;
 }
 init();
}

// ---------- Cold vs antibiotic ----------
function cold(){
 let s;const init=()=>{s={d:0,V:8,F:18,B:0,ab:false,msg:"بیمار سرماخورده و گلودرد دارد. علت این بیماری ویروس است. او فکر می‌کند آنتی‌بیوتیک زود خوبش می‌کند."};draw()};
 const rest=()=>{s.d++;s.V=Math.max(0,s.V-2);if(s.ab){s.B=Math.min(8,s.B+2)}
  s.msg=s.V===0?"سرماخوردگی با کمک سیستم ایمنی تمام شد."+(s.ab?" ولی فلور روده هنوز آسیب‌دیده و باکتری‌های ناخوانده جایشان را گرفته‌اند. اگر آنتی‌بیوتیک نمی‌خورد، فلور سالم می‌ماند.":" و فلور روده‌اش هم سالم ماند."):"یک روز گذشت. سیستم ایمنی دارد ویروس را کم می‌کند.";draw()};
 const ab=()=>{s.ab=true;s.F=4;s.B=3;s.msg="آنتی‌بیوتیک ویروس را نکشت، ولی بیشتر باکتری‌های مفید روده را کشت. باکتری‌های ناخوانده و مقاوم فرصت پیدا کردند.";draw()};
 function draw(){
  const face=s.V===0?(s.ab?"🤢":"🙂"):(s.ab?"🤢":"🤧");
  app.innerHTML=`<div class="card"><h2>ویروس یا باکتری؟</h2>
  <div class="pt"><div class="face">${face}</div><div>روز ${fa(s.d)}${s.ab?" · آنتی‌بیوتیک مصرف شده":""}</div></div>
  <div class="bl"><span>🫁 حلق و بینی: ویروس سرماخوردگی</span></div><div class="field" style="min-height:90px">${grp("vir","v",s.V)||"<span class='note'>ویروس تمام شد</span>"}</div>
  <div class="bl"><span>🧫 روده: باکتری‌های مفید و ناخوانده</span></div><div class="field" style="min-height:120px">${grp("rod","f",s.F)}${grp("rodR","b",s.B)}</div>
  <div class="lg"><span><i style="background:var(--vir)"></i>ویروس</span><span><i style="background:var(--grn)"></i>فلور مفید</span><span><i style="background:#b0482e"></i>باکتری ناخوانده/مقاوم</span></div>
  <div class="tip" aria-live="polite">${esc(s.msg)}</div>
  <div class="row"><button class="btn" id="c1" ${s.V===0?"disabled":""}>🛌 استراحت و مایعات (یک روز)</button><button class="btn m" id="c2" ${s.ab?"disabled":""}>💊 آنتی‌بیوتیک بخورد</button></div>
  <button class="btn g" id="c3">از اول</button>
  <p class="note">آنتی‌بیوتیک‌ها روی ویروس اثر ندارند: ${lk("fact")}. آسیب به فلور طبیعی روده از عوارض شناخته‌شده‌ی آنتی‌بیوتیک‌هاست؛ این تصویر ساده‌شده است.</p></div>`;
  $("#c1").onclick=rest;$("#c2").onclick=ab;$("#c3").onclick=init;
 }
 init();
}

// ---------- One Health ----------
function health(){
 const N=[["🧑","انسان","مصرف نابجا مثل آنتی‌بیوتیک برای سرماخوردگی یا مصرف بدون نسخه."],["🐄","دام","مصرف نابجای ضدمیکروب‌ها در سلامت و پرورش دام."],["🌾","تولید غذا","مصرف نابجا در زنجیره‌ی تولید غذا."],["🌊","محیط","آلودگی محیطی با ضدمیکروب‌ها و میکروب‌ها؛ ارتباط خاک، آب و موجودات زنده."]];
 let sel=0;
 const R=[["جنوب‌شرق آسیا و مدیترانه‌ی شرقی",33],["آفریقا",20],["آمریکا",14],["اروپا",10]];
 function draw(){
  app.innerHTML=`<div class="card"><h2>همه‌چیز به هم وصل است</h2>
  <p class="note" style="margin:0">روی هر کدام بزن. سازمان جهانی بهداشت می‌گوید مصرف نابجا در این چهار حوزه به مقاومت دامن می‌زند و راه‌حل «یک سلامت» است: هماهنگی بین سلامت انسان، دام و محیط. ${lk("work")}</p>
  <div class="nodes">${N.map((n,i)=>`<button class="nd" data-i="${i}" aria-pressed="${sel===i}"><span>${n[0]}</span>${n[1]}</button>`).join("")}</div>
  <div class="tip">${esc(N[sel][2])}</div></div>
  <div class="card"><h2>مقاومت در جهان (۲۰۲۳)</h2>
  <div class="num"><div><b data-c="1">۱ از ۶</b>عفونت باکتریایی تأییدشده مقاوم بود</div><div><b data-n="40">۴۰٪+</b>ای‌کولای مقاوم به سفالوسپورین نسل ۳</div><div><b data-n="55">۵۵٪+</b>کلبسیلا پنومونیه مقاوم به آن</div></div>
  ${R.map(r=>`<div class="hb"><span>${r[0]}</span><div class="bar" style="margin:0"><i style="width:0;background:var(--mag)" data-w="${r[1]*2.5}"></i></div></div><div class="note" style="margin:0 0 4px;text-align:left">${r[1]===33?"۱ از ۳":r[1]===20?"۱ از ۵":r[1]===14?"۱ از ۷":"۱ از ۱۰"}</div>`).join("")}
  <p class="note">نسبت عفونت‌های مقاوم به تفکیک منطقه. منبع: ${lk("glass")} · ${lk("cidrap")}</p></div>`;
  app.querySelectorAll(".nd").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;draw()});
  setTimeout(()=>app.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%"),60);
 }
 draw();
}

// ---------- Myths ----------
function myths(){
 const M=[
 ["«آنتی‌بیوتیک سرماخوردگی را زودتر خوب می‌کند.»","نه. سرماخوردگی و آنفلوآنزا ویروسی‌اند و آنتی‌بیوتیک روی ویروس اثر ندارد. مصرف بی‌مورد فقط مقاومت را بیشتر می‌کند.",["fact","work"]],
 ["«بدن من به آنتی‌بیوتیک عادت کرده و دیگر اثر نمی‌کند.»","این میکروب‌ها هستند که مقاوم می‌شوند، نه بدن تو. مقاومت به دلیل تغییر در خود میکروب‌هاست.",["fact"]],
 ["«مقاومت فقط مشکل کشورهای فقیر است.»","همه‌ی مناطق جهان را درگیر کرده است. در ۲۰۲۳ در اروپا ۱ از ۱۰ و در آمریکا ۱ از ۷ عفونت مقاوم بود.",["glass","paho"]],
 ["«فقط باکتری‌ها مقاوم می‌شوند.»","نه. باکتری، ویروس، قارچ و انگل می‌توانند به داروهای ضدمیکروبی پاسخ ندهند. آنتی‌بیوتیک فقط یکی از انواع ضدمیکروب است.",["fact"]],
 ["«مقاومت فقط به خاطر مصرف دارو در انسان است.»","نه. مصرف نابجا در سلامت انسان و دام، تولید غذا و آلودگی محیطی هر سه نقش دارند.",["work"]]];
 app.innerHTML=`<div class="card"><h2>افسانه‌شکن</h2><p class="note" style="margin:0 0 10px">روی هر باور غلط بزن تا حقیقتش را ببینی.</p>${M.map((m,i)=>`<div class="mt"><button data-i="${i}" aria-label="برگرداندن کارت"><div class="in"><div class="fa"><b>🤔 باور رایج</b><br>${esc(m[0])}</div><div class="ba">${esc(m[1])}<br>${m[2].map(k=>`<a href="${S[k][1]}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(S[k][0].split(":")[0])}</a>`).join(" · ")}</div></div></button></div>`).join("")}</div>`;
 app.querySelectorAll(".mt button").forEach(b=>b.onclick=()=>b.firstElementChild.classList.toggle("fp"));
}

// ---------- Pledge ----------
function pledge(){
 const P=["بدون نسخه آنتی‌بیوتیک نمی‌خرم.","داروی باقی‌مانده را خودم مصرف نمی‌کنم و به دیگران نمی‌دهم.","دارو را سر ساعت و طبق دستور پزشک می‌خورم.","برای سرماخوردگی و آنفلوآنزا آنتی‌بیوتیک نمی‌خواهم.","این را به یک نفر دیگر هم می‌گویم."];
 const on=new Set();
 function draw(){
  const n=on.size,full=n===P.length;
  app.innerHTML=`<div class="card"><h2>پیمان من</h2>${P.map((p,i)=>`<label class="ck"><input type="checkbox" data-i="${i}" ${on.has(i)?"checked":""}>${esc(p)}</label>`).join("")}
  <div class="bar" style="margin-top:14px"><i style="width:${n/P.length*100}%;background:var(--teal)"></i></div>
  <div class="big">${full?"🏅 قهرمان مقاومت‌شکن!":fa(n)+" از "+fa(P.length)}</div>
  ${full?`<button class="btn" id="sh">اشتراک‌گذاری پیمان</button>`:""}</div>`;
  app.querySelectorAll("input").forEach(c=>c.onchange=()=>{c.checked?on.add(+c.dataset.i):on.delete(+c.dataset.i);draw()});
  const sh=$("#sh");if(sh)sh.onclick=async()=>{const t="من متعهد شدم مصرف آنتی‌بیوتیک را درست انجام دهم تا مقاومت میکروبی کمتر شود: "+P.join(" ");try{navigator.share?await navigator.share({text:t}):(await navigator.clipboard.writeText(t),sh.textContent="کپی شد")}catch(e){}};
 }
 draw();
}

function src(){
 app.innerHTML=`<div class="card"><h2>منابع</h2><ul class="src">${Object.keys(S).map(k=>`<li>${esc(S[k][0])}<br><a href="${S[k][1]}" target="_blank" rel="noopener">${S[k][1]}</a></li>`).join("")}</ul>
 <p class="note">اعداد منطقه‌ای و جهانی از گزارش GLASS سال ۲۰۲۵ WHO (داده‌ی ۲۰۲۳) گرفته شده‌اند. بخش‌های شبیه‌ساز مدل‌های ساده‌شده‌ی آموزشی‌اند و اصول داروشناسی (غلظت مؤثر، انتخاب مقاومت) را نشان می‌دهند. این اپ آموزشی است و جایگزین توصیه‌ی پزشک یا داروساز نیست.</p></div>`;
}
const T=[["💊 درمان درست",battle],["🤧 ویروس یا باکتری؟",cold],["🌍 یک سلامت",health],["💥 افسانه‌شکن",myths],["🏅 پیمان من",pledge],["📚 منابع",src]];
const nav=$("#nav");
T.forEach((t,k)=>{const b=document.createElement("button");b.textContent=t[0];b.setAttribute("aria-pressed",k===0);b.onclick=()=>{[...nav.children].forEach((e,j)=>e.setAttribute("aria-pressed",j===k));t[1]()};nav.appendChild(b)});
battle();
</script>
